<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;700&display=swap">
  <title>DSA Course: Beginner to Expert</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #fff;
      --ink: #1c2233;
      --mut: #667;
      --line: #e1e5ef;
      --acc: #3b5bdb;
      --acc2: #e8edff;
      --ok: #1b8a4b;
      --okb: #e3f6ea;
      --bad: #c92a2a;
      --badb: #fde8e8;
      --code: #141a2e
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #0f1320;
        --card: #181d30;
        --ink: #e8ebf5;
        --mut: #9aa3bd;
        --line: #2a3150;
        --acc: #7c98ff;
        --acc2: #222a4a;
        --ok: #4cd68a;
        --okb: #13301f;
        --bad: #ff7b7b;
        --badb: #3a1a1a;
        --code: #0a0d18
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 16px/1.6 Georgia, 'Noto Sans Gujarati', 'Times New Roman', serif;
      background: var(--bg);
      color: var(--ink)
    }

    h1,
    h2,
    h3,
    button,
    .nav,
    .tag,
    .sc {
      font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans Gujarati', sans-serif
    }

    .app {
      display: grid;
      grid-template-columns: 290px 1fr;
      min-height: 100vh
    }

    aside {
      background: var(--card);
      border-right: 1px solid var(--line);
      padding: 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto
    }

    aside h1 {
      font-size: 20px;
      margin: 0 0 4px
    }

    .bar {
      height: 8px;
      background: var(--line);
      border-radius: 9px;
      overflow: hidden;
      margin: 8px 0 4px
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--acc);
      width: 0;
      transition: width .4s
    }

    .nav {
      font-size: 14px
    }

    .lv {
      margin: 16px 0 4px;
      font-weight: 700;
      color: var(--mut);
      font-size: 13px
    }

    .nav button {
      display: flex;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      color: var(--ink);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px
    }

    .nav button:hover {
      background: var(--acc2)
    }

    .nav button.on {
      background: var(--acc);
      color: #fff
    }

    main {
      padding: 28px;
      max-width: 860px;
      width: 100%
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 14px 0
    }

    .tabs button,
    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px
    }

    .tabs button.on,
    .btn.p {
      background: var(--acc);
      color: #fff;
      border-color: var(--acc)
    }

    .btn:focus-visible,
    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px
    }

    .tip {
      background: var(--acc2);
      border-left: 4px solid var(--acc);
      padding: 10px 14px;
      border-radius: 6px;
      margin: 12px 0
    }

    pre {
      background: var(--code);
      color: #dfe6ff;
      padding: 14px;
      border-radius: 10px;
      overflow: auto;
      font: 13px/1.5 ui-monospace, Consolas, monospace;
      margin: 10px 0
    }

    textarea {
      width: 100%;
      height: 210px;
      background: var(--code);
      color: #dfe6ff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font: 13px/1.5 ui-monospace, Consolas, monospace;
      resize: vertical
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      margin: 6px 0;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px
    }

    .opt.sel {
      border-color: var(--acc);
      background: var(--acc2)
    }

    .opt.ok {
      border-color: var(--ok);
      background: var(--okb)
    }

    .opt.no {
      border-color: var(--bad);
      background: var(--badb)
    }

    .exp {
      font-size: 14px;
      color: var(--mut);
      margin: 6px 0 14px
    }

    .res {
      font: 14px/1.6 ui-monospace, Consolas, monospace;
      margin-top: 10px
    }

    .res .p {
      color: var(--ok)
    }

    .res .f {
      color: var(--bad)
    }

    .tag {
      font-size: 12px;
      background: var(--acc2);
      color: var(--acc);
      padding: 2px 10px;
      border-radius: 99px
    }

    .big {
      font: 700 54px/1 system-ui;
      color: var(--acc)
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px
    }

    td,
    th {
      border: 1px solid var(--line);
      padding: 6px 10px;
      text-align: left
    }

    @media(max-width:760px) {
      .app {
        grid-template-columns: 1fr
      }

      aside {
        position: static;
        height: auto
      }

      main {
        padding: 16px
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside>
      <h1 id="ttl">DSA Course</h1>
      <div class="tabs" id="langbar"><button id="l-en" onclick="setLang('en')">English</button><button id="l-gu"
          onclick="setLang('gu')">ગુજરાતી</button></div>
      <div class="sc" style="font-size:13px;color:var(--mut)" id="side-score"></div>
      <div class="bar"><i id="pbar"></i></div>
      <div class="nav" id="nav"></div>
      <button class="btn" id="b-res" style="margin-top:16px;width:100%" onclick="showResult()">View final
        result</button>
      <button class="btn" id="b-rst" style="margin-top:8px;width:100%" onclick="resetAll()">Reset progress</button>
    </aside>
    <main id="main"></main>
  </div>
  <script>
    // ===== COURSE DATA: add new topics here. Each topic = learn + code + quiz + practice =====
    const T = [
      {
        id: 'bigo', lv: 'Level 1: Foundations', t: 'Big-O Complexity',
        learn: `<p><b>Big-O</b> tells you how the running time of code <i>grows</i> as the input size <b>n</b> grows. It ignores machine speed and focuses on growth.</p>
<div class="tip"><b>Analogy:</b> Finding a name in a phone book. Reading every page is O(n). Opening the middle and halving each time is O(log n). Knowing the page number is O(1).</div>
<table><tr><th>Big-O</th><th>Name</th><th>Example</th></tr><tr><td>O(1)</td><td>Constant</td><td>Read arr[5]</td></tr><tr><td>O(log n)</td><td>Logarithmic</td><td>Binary search</td></tr><tr><td>O(n)</td><td>Linear</td><td>Loop once</td></tr><tr><td>O(n log n)</td><td>Linearithmic</td><td>Merge sort</td></tr><tr><td>O(n²)</td><td>Quadratic</td><td>Nested loops</td></tr><tr><td>O(2ⁿ)</td><td>Exponential</td><td>Naive Fibonacci</td></tr></table>
<p>Rule: drop constants and smaller terms. 3n + 10 becomes O(n).</p>`,
        code: `// O(n): one loop\nfunction sum(arr){ let s=0; for(const x of arr) s+=x; return s; }\n// O(n²): nested loops\nfunction pairs(arr){ for(const a of arr) for(const b of arr) console.log(a,b); }`,
        mcq: [{ q: 'Two nested loops over n items. Complexity?', o: ['O(n)', 'O(n²)', 'O(log n)', 'O(1)'], a: 1, e: 'n iterations times n iterations = n².' },
        { q: 'Which grows slowest as n gets large?', o: ['O(n)', 'O(n²)', 'O(log n)', 'O(2ⁿ)'], a: 2, e: 'log n grows slowest of these.' }],
        pr: { d: 'Write <code>sumN(n)</code> that returns 1+2+...+n in O(1) time (no loops).', fn: 'sumN', st: 'function sumN(n){\n  // your code\n}', tests: [[[5], 15], [[100], 5050], [[1], 1]], sol: 'function sumN(n){ return n*(n+1)/2; }' }
      },

      {
        id: 'arr', lv: 'Level 1: Foundations', t: 'Arrays',
        learn: `<p>An <b>array</b> stores items in consecutive memory, so reading by index is instant.</p>
<div class="tip"><b>Analogy:</b> A row of numbered lockers. Opening locker 7 is instant, but inserting a new locker in the middle means shifting everyone.</div>
<ul><li>Access by index: O(1)</li><li>Search unsorted: O(n)</li><li>Insert/delete in middle: O(n)</li><li>Append at end: O(1) on average</li></ul>
<p><b>Pattern:</b> the two-pointer technique uses one pointer to read and one to write.</p>`,
        code: `const a=[4,7,1];\na.push(9);      // [4,7,1,9]\nlet w=0;        // write pointer\nfor(let r=0;r<a.length;r++){ if(a[r]!==7) a[w++]=a[r]; }\na.length=w;     // removes all 7s in O(n)`,
        mcq: [{ q: 'Time to read arr[1000]?', o: ['O(1)', 'O(n)', 'O(log n)', 'O(n²)'], a: 0, e: 'Index math gives direct access.' },
        { q: 'Inserting at the start of an array costs?', o: ['O(1)', 'O(log n)', 'O(n)', 'O(n²)'], a: 2, e: 'All elements shift right.' }],
        pr: { d: 'Write <code>moveZeros(arr)</code> that returns a new array with all 0s moved to the end, keeping the order of other numbers.', fn: 'moveZeros', st: 'function moveZeros(arr){\n  // your code\n}', tests: [[[[0, 1, 0, 3, 12]], [1, 3, 12, 0, 0]], [[[1, 2]], [1, 2]], [[[0, 0]], [0, 0]]], sol: 'function moveZeros(arr){ const r=arr.filter(x=>x!==0); while(r.length<arr.length) r.push(0); return r; }' }
      },

      {
        id: 'str', lv: 'Level 1: Foundations', t: 'Strings',
        learn: `<p>A <b>string</b> is a sequence of characters. In JavaScript strings are <b>immutable</b>: changing one creates a new string.</p>
<div class="tip"><b>Analogy:</b> A printed sentence. To fix a typo you reprint the line.</div>
<p><b>Pattern:</b> two pointers from both ends toward the middle solve palindrome and reverse problems in O(n).</p>`,
        code: `function isPal(s){\n  let i=0,j=s.length-1;\n  while(i<j){ if(s[i++]!==s[j--]) return false; }\n  return true;\n}`,
        mcq: [{ q: 'Which is true about JS strings?', o: ['Mutable', 'Immutable', 'Always sorted', 'Fixed 8 chars'], a: 1, e: 'You cannot change a character in place.' },
        { q: 'Checking a palindrome with two pointers takes?', o: ['O(1)', 'O(n)', 'O(n²)', 'O(log n)'], a: 1, e: 'Each character is visited at most once.' }],
        pr: { d: 'Write <code>isPalindrome(s)</code>. Ignore case; assume only letters and digits.', fn: 'isPalindrome', st: 'function isPalindrome(s){\n  // your code\n}', tests: [[['Racecar'], true], [['hello'], false], [['a'], true], [['abBA'], true]], sol: 'function isPalindrome(s){ s=s.toLowerCase(); let i=0,j=s.length-1; while(i<j){ if(s[i++]!==s[j--]) return false; } return true; }' }
      },

      {
        id: 'hash', lv: 'Level 1: Foundations', t: 'Hashing (Map & Set)',
        learn: `<p>A <b>hash map</b> stores key-value pairs and finds a key in about O(1). A <b>set</b> stores unique values.</p>
<div class="tip"><b>Analogy:</b> A coat-check. You hand over a ticket (key) and get your coat instantly without searching every hanger.</div>
<p><b>Pattern:</b> trade memory for speed. Replace an inner loop with a map lookup to turn O(n²) into O(n).</p>`,
        code: `const seen=new Map();\nfor(let i=0;i<nums.length;i++){\n  const need=target-nums[i];\n  if(seen.has(need)) return [seen.get(need),i];\n  seen.set(nums[i],i);\n}`,
        mcq: [{ q: 'Average lookup time in a hash map?', o: ['O(1)', 'O(n)', 'O(log n)', 'O(n²)'], a: 0, e: 'Hashing jumps straight to the bucket.' },
        { q: 'Which structure removes duplicates quickly?', o: ['Array', 'Set', 'Stack', 'Queue'], a: 1, e: 'A Set only keeps unique values.' }],
        pr: { d: 'Write <code>twoSum(nums, target)</code> returning the two indices (smaller first) whose values add to target. Exactly one answer exists.', fn: 'twoSum', st: 'function twoSum(nums,target){\n  // your code\n}', tests: [[[[2, 7, 11, 15], 9], [0, 1]], [[[3, 2, 4], 6], [1, 2]], [[[3, 3], 6], [0, 1]]], sol: 'function twoSum(n,t){ const m=new Map(); for(let i=0;i<n.length;i++){ if(m.has(t-n[i])) return [m.get(t-n[i]),i]; m.set(n[i],i);} }' }
      },

      {
        id: 'rec', lv: 'Level 1: Foundations', t: 'Recursion',
        learn: `<p><b>Recursion</b> means a function calls itself on a smaller problem. Every recursion needs a <b>base case</b> (when to stop) and a <b>recursive case</b>.</p>
<div class="tip"><b>Analogy:</b> Russian nesting dolls. Open one, find a smaller one inside, repeat until the smallest doll (base case).</div>
<p>Each call sits on the <b>call stack</b>. Missing a base case causes a stack overflow.</p>`,
        code: `function fact(n){\n  if(n<=1) return 1;      // base case\n  return n*fact(n-1);     // recursive case\n}`,
        mcq: [{ q: 'What stops a recursion?', o: ['Loop', 'Base case', 'Array', 'Hash'], a: 1, e: 'The base case returns without recursing.' },
        { q: 'Missing base case causes?', o: ['Faster code', 'Stack overflow', 'Sorted output', 'Nothing'], a: 1, e: 'Calls pile up until memory runs out.' }],
        pr: { d: 'Write <code>factorial(n)</code> using recursion. factorial(0) = 1.', fn: 'factorial', st: 'function factorial(n){\n  // your code\n}', tests: [[[5], 120], [[0], 1], [[1], 1], [[7], 5040]], sol: 'function factorial(n){ return n<=1?1:n*factorial(n-1); }' }
      },

      {
        id: 'll', lv: 'Level 2: Core Structures', t: 'Linked Lists',
        learn: `<p>A <b>linked list</b> is a chain of nodes. Each node holds a value and a pointer to the next node.</p>
<div class="tip"><b>Analogy:</b> A treasure hunt. Each clue tells you where the next one is. You can't jump to clue 5 directly.</div>
<ul><li>Insert/delete at head: O(1)</li><li>Access by position: O(n)</li></ul>
<p><b>Pattern:</b> fast and slow pointers find the middle or detect cycles.</p>`,
        code: `// node = { val: 1, next: {val:2, next:null} }\nlet prev=null, cur=head;\nwhile(cur){ const nx=cur.next; cur.next=prev; prev=cur; cur=nx; }\nreturn prev; // reversed head`,
        mcq: [{ q: 'Access the 5th node in a linked list?', o: ['O(1)', 'O(n)', 'O(log n)', 'O(n²)'], a: 1, e: 'You must walk from the head.' },
        { q: 'Insert at head costs?', o: ['O(1)', 'O(n)', 'O(log n)', 'O(n²)'], a: 0, e: 'Just re-point the head.' }],
        pr: { d: 'Write <code>reverseList(head)</code>. Nodes look like <code>{val, next}</code>. Return the new head.', fn: 'reverseList', st: 'function reverseList(head){\n  // your code\n}', tests: [[[{ val: 1, next: { val: 2, next: { val: 3, next: null } } }], { val: 3, next: { val: 2, next: { val: 1, next: null } } }], [[null], null]], sol: 'function reverseList(h){ let p=null; while(h){ const n=h.next; h.next=p; p=h; h=n; } return p; }' }
      },

      {
        id: 'sq', lv: 'Level 2: Core Structures', t: 'Stacks & Queues',
        learn: `<p>A <b>stack</b> is Last-In-First-Out (LIFO). A <b>queue</b> is First-In-First-Out (FIFO).</p>
<div class="tip"><b>Analogy:</b> Stack = pile of plates (take the top one). Queue = ticket line (first person is served first).</div>
<p>Stacks power undo, bracket matching, and DFS. Queues power scheduling and BFS.</p>`,
        code: `const st=[]; st.push(1); st.push(2); st.pop(); // 2\nconst q=[]; q.push(1); q.push(2); q.shift(); // 1`,
        mcq: [{ q: 'Which is LIFO?', o: ['Queue', 'Stack', 'Set', 'Map'], a: 1, e: 'Last pushed is first popped.' },
        { q: 'BFS uses which structure?', o: ['Stack', 'Queue', 'Set', 'Tree'], a: 1, e: 'BFS explores level by level, FIFO.' }],
        pr: { d: 'Write <code>validParentheses(s)</code>. The string has only <code>()[]{}</code>. Return true if brackets close in the right order.', fn: 'validParentheses', st: 'function validParentheses(s){\n  // your code\n}', tests: [[['()[]{}'], true], [['(]'], false], [['([{}])'], true], [['(('], false]], sol: 'function validParentheses(s){ const m={")":"(","]":"[","}":"{"},st=[]; for(const c of s){ if(m[c]){ if(st.pop()!==m[c]) return false; } else st.push(c);} return st.length===0; }' }
      },

      {
        id: 'bs', lv: 'Level 2: Core Structures', t: 'Binary Search',
        learn: `<p><b>Binary search</b> finds a value in a <b>sorted</b> array by halving the search range each step: O(log n).</p>
<div class="tip"><b>Analogy:</b> Guess a number 1 to 100. Ask "higher or lower?" and you need at most 7 guesses.</div>
<p>Keep <code>lo</code> and <code>hi</code>. Check the middle, then discard half.</p>`,
        code: `let lo=0, hi=a.length-1;\nwhile(lo<=hi){\n  const mid=Math.floor((lo+hi)/2);\n  if(a[mid]===t) return mid;\n  if(a[mid]<t) lo=mid+1; else hi=mid-1;\n}\nreturn -1;`,
        mcq: [{ q: 'Binary search requires the array to be?', o: ['Unique', 'Sorted', 'Positive', 'Even length'], a: 1, e: 'Halving only works when order is known.' },
        { q: 'Complexity of binary search?', o: ['O(n)', 'O(log n)', 'O(1)', 'O(n log n)'], a: 1, e: 'The range halves every step.' }],
        pr: { d: 'Write <code>binarySearch(arr, target)</code> returning the index, or -1 if missing. Array is sorted.', fn: 'binarySearch', st: 'function binarySearch(arr,target){\n  // your code\n}', tests: [[[[1, 3, 5, 7, 9], 7], 3], [[[1, 3, 5], 4], -1], [[[2], 2], 0]], sol: 'function binarySearch(a,t){ let lo=0,hi=a.length-1; while(lo<=hi){ const m=(lo+hi)>>1; if(a[m]===t) return m; if(a[m]<t) lo=m+1; else hi=m-1; } return -1; }' }
      },

      {
        id: 'sort', lv: 'Level 2: Core Structures', t: 'Sorting',
        learn: `<p>Sorting puts items in order. Simple sorts are O(n²); smart sorts are O(n log n).</p>
<div class="tip"><b>Analogy:</b> Sorting playing cards in your hand: pick each new card and slide it into the right spot (insertion sort).</div>
<table><tr><th>Algorithm</th><th>Time</th><th>Idea</th></tr><tr><td>Bubble</td><td>O(n²)</td><td>Swap neighbours</td></tr><tr><td>Insertion</td><td>O(n²)</td><td>Insert into sorted part</td></tr><tr><td>Merge</td><td>O(n log n)</td><td>Split, sort, merge</td></tr><tr><td>Quick</td><td>O(n log n) avg</td><td>Partition by pivot</td></tr></table>`,
        code: `for(let i=1;i<a.length;i++){\n  const k=a[i]; let j=i-1;\n  while(j>=0 && a[j]>k){ a[j+1]=a[j]; j--; }\n  a[j+1]=k;\n}`,
        mcq: [{ q: 'Best general-purpose complexity for comparison sorts?', o: ['O(n)', 'O(n log n)', 'O(n²)', 'O(log n)'], a: 1, e: 'n log n is the proven lower bound.' },
        { q: 'Which algorithm splits then merges?', o: ['Bubble', 'Insertion', 'Merge sort', 'Selection'], a: 2, e: 'Merge sort divides and merges.' }],
        pr: { d: 'Write <code>sortArray(arr)</code> that returns the numbers in ascending order <b>without</b> using <code>.sort()</code>.', fn: 'sortArray', st: 'function sortArray(arr){\n  // your code\n}', tests: [[[[5, 2, 9, 1]], [1, 2, 5, 9]], [[[3, 3, 1]], [1, 3, 3]], [[[]], []]], sol: 'function sortArray(arr){ const a=[...arr]; for(let i=1;i<a.length;i++){ const k=a[i]; let j=i-1; while(j>=0&&a[j]>k){ a[j+1]=a[j]; j--; } a[j+1]=k; } return a; }' }
      },

      {
        id: 'tree', lv: 'Level 3: Intermediate', t: 'Trees',
        learn: `<p>A <b>tree</b> has a root and child nodes. A <b>binary tree</b> has at most two children (left, right). In a <b>BST</b>, left &lt; node &lt; right.</p>
<div class="tip"><b>Analogy:</b> A family tree or company org chart.</div>
<p>Trees are naturally recursive: solve the left subtree, solve the right subtree, combine.</p>`,
        code: `// node = { val, left, right }\nfunction height(n){\n  if(!n) return 0;\n  return 1+Math.max(height(n.left),height(n.right));\n}`,
        mcq: [{ q: 'A BST keeps which order?', o: ['left > node', 'left < node < right', 'random', 'sorted by depth'], a: 1, e: 'Smaller values go left, larger go right.' },
        { q: 'Natural way to solve tree problems?', o: ['Recursion', 'Sorting', 'Hashing', 'Bit math'], a: 0, e: 'Subtrees are smaller trees.' }],
        pr: { d: 'Write <code>maxDepth(root)</code> returning the number of nodes on the longest root-to-leaf path. Nodes are <code>{val,left,right}</code>; empty tree is null.', fn: 'maxDepth', st: 'function maxDepth(root){\n  // your code\n}', tests: [[[{ val: 1, left: { val: 2, left: null, right: null }, right: { val: 3, left: { val: 4, left: null, right: null }, right: null } }], 3], [[null], 0], [[{ val: 1, left: null, right: null }], 1]], sol: 'function maxDepth(r){ return r?1+Math.max(maxDepth(r.left),maxDepth(r.right)):0; }' }
      },

      {
        id: 'graph', lv: 'Level 4: Advanced', t: 'Graphs (BFS/DFS)',
        learn: `<p>A <b>graph</b> is nodes (vertices) connected by edges. It models maps, networks, and dependencies.</p>
<div class="tip"><b>Analogy:</b> A city map. Cities are nodes, roads are edges.</div>
<ul><li><b>BFS</b> (queue): explore level by level. Finds shortest path in unweighted graphs.</li><li><b>DFS</b> (stack/recursion): go deep first, then backtrack.</li></ul>
<p>Store graphs as an <b>adjacency list</b>: <code>{0:[1,2], 1:[0]}</code>. Always track visited nodes.</p>`,
        code: `function dfs(node,adj,seen){\n  seen.add(node);\n  for(const nb of adj[node]) if(!seen.has(nb)) dfs(nb,adj,seen);\n}`,
        mcq: [{ q: 'Which finds the shortest path in an unweighted graph?', o: ['DFS', 'BFS', 'Binary search', 'Hashing'], a: 1, e: 'BFS reaches nodes in order of distance.' },
        { q: 'Why keep a visited set?', o: ['Speed up sorting', 'Avoid infinite loops', 'Reduce memory', 'Balance tree'], a: 1, e: 'Cycles would cause endless revisits.' }],
        pr: { d: 'Write <code>countComponents(n, edges)</code>: nodes are 0..n-1, edges is a list of [a,b]. Return the number of connected groups.', fn: 'countComponents', st: 'function countComponents(n,edges){\n  // your code\n}', tests: [[[5, [[0, 1], [1, 2], [3, 4]]], 2], [[4, []], 4], [[3, [[0, 1], [1, 2], [0, 2]]], 1]], sol: 'function countComponents(n,e){ const adj=Array.from({length:n},()=>[]); for(const [a,b] of e){adj[a].push(b);adj[b].push(a);} const s=new Set(); let c=0; const dfs=u=>{ s.add(u); for(const v of adj[u]) if(!s.has(v)) dfs(v); }; for(let i=0;i<n;i++) if(!s.has(i)){ c++; dfs(i);} return c; }' }
      },

      {
        id: 'dp', lv: 'Level 4: Advanced', t: 'Dynamic Programming',
        learn: `<p><b>Dynamic Programming (DP)</b> solves a problem by breaking it into overlapping subproblems and <b>remembering</b> each answer so it is never computed twice.</p>
<div class="tip"><b>Analogy:</b> Writing answers on a cheat sheet. If you already solved 5 + 3, just look it up.</div>
<p>Steps: define the state, write the recurrence, set base cases, then use memoization (top-down) or a table (bottom-up). Naive Fibonacci is O(2ⁿ); DP makes it O(n).</p>`,
        code: `function fib(n,memo={}){\n  if(n<=1) return n;\n  if(memo[n]) return memo[n];\n  return memo[n]=fib(n-1,memo)+fib(n-2,memo);\n}`,
        mcq: [{ q: 'DP works best when a problem has?', o: ['Sorted input', 'Overlapping subproblems', 'Only one loop', 'A tree shape'], a: 1, e: 'Repeated subproblems can be cached.' },
        { q: 'Memoization means?', o: ['Sorting results', 'Caching computed results', 'Deleting nodes', 'Using bits'], a: 1, e: 'Store results to reuse them.' }],
        pr: { d: 'Write <code>climbStairs(n)</code>: you climb 1 or 2 steps at a time. How many distinct ways to reach step n?', fn: 'climbStairs', st: 'function climbStairs(n){\n  // your code\n}', tests: [[[2], 2], [[3], 3], [[5], 8], [[10], 89]], sol: 'function climbStairs(n){ let a=1,b=1; for(let i=2;i<=n;i++){ [a,b]=[b,a+b]; } return b; }' }
      },
      {
        id: 'maths', lv: 'Maths, Pattern & Recursion', t: 'Maths & Patterns',
        learn: `<p>Many problems reduce to simple maths: even/odd (<code>n%2</code>), digits (<code>n%10</code> and <code>Math.floor(n/10)</code>), divisors, primes. Pattern printing uses nested loops: outer loop = rows, inner loop = columns.</p><div class="tip"><b>Analogy:</b> A prime can't be split into equal smaller groups. Factors come in pairs, so checking up to √n is enough.</div>`,
        code: `function isPrime(n){\n  if(n<2) return false;\n  for(let i=2;i*i<=n;i++) if(n%i===0) return false;\n  return true;\n}`,
        mcq: [{ q: 'Why test divisors only up to √n?', o: ['Primes are small', 'Factors come in pairs', 'JS requires it', 'Avoids negatives'], a: 1, e: 'Every factor above √n pairs with one below it.' }, { q: 'Which gives the last digit of n?', o: ['n/10', 'n*10', 'n%10', 'n-10'], a: 2, e: 'n % 10 is the remainder, the last digit.' }],
        pr: { d: 'Write <code>isPrime(n)</code>.', fn: 'isPrime', st: 'function isPrime(n){\n  // your code\n}', tests: [[[2], true], [[1], false], [[17], true], [[21], false]], sol: 'function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }' }
      },

      {
        id: 'bit', lv: 'Bit Manipulation', t: 'Bitwise Algorithms',
        learn: `<p>Bitwise operators work on binary digits: <code>&amp;</code> AND, <code>|</code> OR, <code>^</code> XOR, <code>~</code> NOT, <code>&lt;&lt;</code> / <code>&gt;&gt;</code> shifts.</p><div class="tip"><b>Analogy:</b> A row of light switches. Each bit is on or off.</div><p>Tricks: <code>n&amp;(n-1)</code> clears the lowest set bit; a power of two has exactly one set bit; <code>a^a = 0</code>.</p>`,
        code: `const isPow2 = n => n>0 && (n&(n-1))===0;\n// find the single non-repeating number\nnums.reduce((a,b)=>a^b);`,
        mcq: [{ q: 'What is 5 ^ 5?', o: ['10', '5', '0', '1'], a: 2, e: 'XOR of equal values is 0.' }, { q: 'Which operator shifts bits left?', o: ['<<', '>>', '&', '^'], a: 0, e: 'x << 1 doubles x.' }],
        pr: { d: 'Write <code>isPowerOfTwo(n)</code> using a bit trick.', fn: 'isPowerOfTwo', st: 'function isPowerOfTwo(n){\n  // your code\n}', tests: [[[8], true], [[6], false], [[1], true], [[0], false]], sol: 'function isPowerOfTwo(n){ return n>0&&(n&(n-1))===0; }' }

      {
        id: 'two', lv: 'Two-Pointer', t: 'Two-Pointer Technique',
        learn: `<p>Use two indexes that move through the data, usually from both ends of a <b>sorted</b> array, to avoid a nested loop. O(n²) becomes O(n).</p><div class="tip"><b>Analogy:</b> Two people searching a bookshelf from opposite ends, walking toward each other.</div><p>If the sum is too small, move the left pointer right. If too large, move the right pointer left.</p>`,
        code: `let i=0, j=a.length-1;\nwhile(i<j){\n  const s=a[i]+a[j];\n  if(s===t) return [i,j];\n  s<t ? i++ : j--;\n}`,
        mcq: [{ q: 'Classic two-pointer needs the array to be?', o: ['Sorted', 'Unique', 'Positive', 'Short'], a: 0, e: 'Order tells you which pointer to move.' }, { q: 'Two-pointer pair search complexity?', o: ['O(n²)', 'O(n)', 'O(log n)', 'O(1)'], a: 1, e: 'Each pointer moves at most n steps.' }],
        pr: { d: 'Write <code>twoSumSorted(arr, target)</code> for a sorted array. Return the indices <code>[i, j]</code> with i &lt; j.', fn: 'twoSumSorted', st: 'function twoSumSorted(arr,target){\n  // your code\n}', tests: [[[[1, 2, 4, 7], 9], [1, 3]], [[[2, 3, 4], 6], [0, 2]]], sol: 'function twoSumSorted(a,t){ let i=0,j=a.length-1; while(i<j){ const s=a[i]+a[j]; if(s===t) return [i,j]; s<t?i++:j--; } }' }
      },

      {
        id: 'win', lv: 'Sliding Window', t: 'Sliding Window',
        learn: `<p>Keep a window over a contiguous part of the array. Slide it by adding the new element and removing the old one, instead of recomputing from scratch.</p><div class="tip"><b>Analogy:</b> A train window moving along the scenery. You only see what enters and leaves.</div><p>Fixed-size windows are O(n); variable-size windows grow and shrink with two pointers.</p>`,
        code: `let w=0; for(let i=0;i<k;i++) w+=a[i];\nlet best=w;\nfor(let i=k;i<a.length;i++){ w+=a[i]-a[i-k]; best=Math.max(best,w); }`,
        mcq: [{ q: 'Sliding window works on?', o: ['Contiguous subarrays', 'Trees', 'Random subsets', 'Graphs'], a: 0, e: 'The window is a continuous range.' }, { q: 'Max sum of size-k windows runs in?', o: ['O(n*k)', 'O(n)', 'O(k)', 'O(n²)'], a: 1, e: 'Each step does O(1) work.' }],
        pr: { d: 'Write <code>maxSumK(arr, k)</code> returning the largest sum of any k consecutive elements.', fn: 'maxSumK', st: 'function maxSumK(arr,k){\n  // your code\n}', tests: [[[[2, 1, 5, 1, 3, 2], 3], 9], [[[1, 2], 2], 3]], sol: 'function maxSumK(a,k){ let w=0; for(let i=0;i<k;i++) w+=a[i]; let b=w; for(let i=k;i<a.length;i++){ w+=a[i]-a[i-k]; b=Math.max(b,w);} return b; }' }
      },

      {
        id: 'pre', lv: 'Prefix Sum', t: 'Prefix Sum',
        learn: `<p>A <b>prefix sum</b> array stores running totals: <code>pre[i] = a[0]+...+a[i-1]</code>. Any range sum becomes <code>pre[r+1] - pre[l]</code> in O(1).</p><div class="tip"><b>Analogy:</b> A bank passbook balance. Money spent between two dates is balance(start) minus balance(end).</div><p>Combine with a hash map to count subarrays with a target sum.</p>`,
        code: `const pre=[0];\nfor(const x of a) pre.push(pre[pre.length-1]+x);\nconst rangeSum=(l,r)=>pre[r+1]-pre[l];`,
        mcq: [{ q: 'Range sum after building prefix sums costs?', o: ['O(n)', 'O(1)', 'O(log n)', 'O(n²)'], a: 1, e: 'Just one subtraction.' }, { q: 'Building the prefix array costs?', o: ['O(1)', 'O(log n)', 'O(n)', 'O(n²)'], a: 2, e: 'One pass over the array.' }],
        pr: { d: 'Write <code>rangeSums(arr, queries)</code>. Each query is <code>[l, r]</code> (inclusive). Return an array of sums.', fn: 'rangeSums', st: 'function rangeSums(arr,queries){\n  // your code\n}', tests: [[[[1, 2, 3, 4], [[0, 1], [1, 3], [2, 2]]], [3, 9, 3]], [[[5], [[0, 0]]], [5]]], sol: 'function rangeSums(a,q){ const p=[0]; for(const x of a) p.push(p[p.length-1]+x); return q.map(([l,r])=>p[r+1]-p[l]); }' }
      },

      {
        id: 'back', lv: 'Backtracking', t: 'Backtracking',
        learn: `<p><b>Backtracking</b> builds a solution step by step, and <i>undoes</i> a choice (backtracks) when it leads nowhere. It explores all possibilities in a smart order.</p><div class="tip"><b>Analogy:</b> Solving a maze. Walk down a path, hit a dead end, step back, try another turn.</div><p>Template: choose, explore (recurse), un-choose. Used for subsets, permutations, N-Queens, Sudoku.</p>`,
        code: `function go(i,cur){\n  res.push([...cur]);\n  for(let j=i;j<a.length;j++){\n    cur.push(a[j]);      // choose\n    go(j+1,cur);         // explore\n    cur.pop();           // un-choose\n  }\n}`,
        mcq: [{ q: 'The key backtracking step after recursing?', o: ['Sort', 'Undo the choice', 'Hash it', 'Stop forever'], a: 1, e: 'Un-choosing lets you try the next option.' }, { q: 'Which is a backtracking problem?', o: ['N-Queens', 'Binary search', 'Prefix sum', 'Two sum'], a: 0, e: 'N-Queens tries placements and undoes bad ones.' }],
        pr: { d: 'Write <code>subsets(nums)</code> returning all subsets. Use the order from the code example: add the current subset first, then extend with later elements (for [1,2] → [[],[1],[1,2],[2]]).', fn: 'subsets', st: 'function subsets(nums){\n  // your code\n}', tests: [[[[1, 2]], [[], [1], [1, 2], [2]]], [[[5]], [[], [5]]], [[[1, 2, 3]], [[], [1], [1, 2], [1, 2, 3], [1, 3], [2], [2, 3], [3]]]], sol: 'function subsets(n){ const r=[]; const go=(i,c)=>{ r.push([...c]); for(let j=i;j<n.length;j++){ c.push(n[j]); go(j+1,c); c.pop(); } }; go(0,[]); return r; }' }
      },

      {
        id: 'queue', lv: 'Queue', t: 'Queue',
        learn: `<p>A <b>queue</b> is First-In-First-Out. Operations: <code>enqueue</code> (add at back), <code>dequeue</code> (remove from front), <code>peek</code>.</p><div class="tip"><b>Analogy:</b> A ticket counter line. The first person to arrive is served first.</div><p>Variants: circular queue (reuses space), priority queue (highest priority first). Used in BFS, scheduling, and buffers. Note: <code>array.shift()</code> is O(n); use an index pointer for O(1).</p>`,
        code: `const q=[]; let head=0;\nq.push(1); q.push(2);      // enqueue\nconst x=q[head++];         // dequeue in O(1)`,
        mcq: [{ q: 'Queue order is?', o: ['LIFO', 'FIFO', 'Sorted', 'Random'], a: 1, e: 'First in, first out.' }, { q: 'Which uses a queue?', o: ['DFS', 'BFS', 'Binary search', 'Quick sort'], a: 1, e: 'BFS processes nodes level by level.' }]
      },

      {
        id: 'deque', lv: 'Deque', t: 'Deque',
        learn: `<p>A <b>deque</b> (double-ended queue) lets you add and remove at both the front and back in O(1).</p><div class="tip"><b>Analogy:</b> A train with doors at both ends. People can enter or leave from either side.</div><p>Famous use: <b>sliding window maximum</b>. Keep indexes in a deque in decreasing value order so the front is always the max.</p>`,
        code: `// monotonic deque (store indexes)\nwhile(dq.length && a[dq[dq.length-1]]<=a[i]) dq.pop();\ndq.push(i);\nif(dq[0]<=i-k) dq.shift();`,
        mcq: [{ q: 'A deque allows operations at?', o: ['Front only', 'Back only', 'Both ends', 'Middle'], a: 2, e: 'That is what double-ended means.' }, { q: 'Deque is used for sliding window?', o: ['Maximum', 'Sorting', 'Hashing', 'Recursion'], a: 0, e: 'A monotonic deque tracks the window max.' }]
      },

      {
        id: 'bst', lv: 'Binary Search Tree', t: 'Binary Search Tree',
        learn: `<p>A <b>BST</b> keeps <code>left &lt; node &lt; right</code> for every node. Search, insert and delete take O(h), where h is the height (O(log n) when balanced).</p><div class="tip"><b>Analogy:</b> A guessing game. Smaller? Go left. Bigger? Go right.</div><p>Inorder traversal of a BST gives sorted order. To validate, pass allowed min/max bounds down the tree.</p>`,
        code: `function isValid(n,lo=-Infinity,hi=Infinity){\n  if(!n) return true;\n  if(n.val<=lo||n.val>=hi) return false;\n  return isValid(n.left,lo,n.val)&&isValid(n.right,n.val,hi);\n}`,
        mcq: [{ q: 'Inorder traversal of a BST gives?', o: ['Random order', 'Sorted order', 'Level order', 'Reverse'], a: 1, e: 'Left, node, right visits values ascending.' }, { q: 'Search in a balanced BST?', o: ['O(n)', 'O(log n)', 'O(1)', 'O(n²)'], a: 1, e: 'Each step halves the tree.' }],
        pr: { d: 'Write <code>isValidBST(root)</code>. Nodes are <code>{val,left,right}</code>; an empty tree is valid.', fn: 'isValidBST', st: 'function isValidBST(root){\n  // your code\n}', tests: [[[{ val: 2, left: { val: 1, left: null, right: null }, right: { val: 3, left: null, right: null } }], true], [[{ val: 2, left: { val: 3, left: null, right: null }, right: { val: 1, left: null, right: null } }], false], [[null], true]], sol: 'function isValidBST(n,lo=-Infinity,hi=Infinity){ if(!n) return true; if(n.val<=lo||n.val>=hi) return false; return isValidBST(n.left,lo,n.val)&&isValidBST(n.right,n.val,hi); }' }
      },

      {
        id: 'heap', lv: 'Heap', t: 'Heap & Priority Queue',
        learn: `<p>A <b>heap</b> is a complete binary tree where each parent is smaller (min-heap) or larger (max-heap) than its children. Stored in an array: children of i are 2i+1 and 2i+2.</p><div class="tip"><b>Analogy:</b> A hospital emergency room. The most urgent patient is always seen next.</div><p>Peek: O(1). Insert / remove top: O(log n). Used for top-K, heap sort, merging sorted lists, Dijkstra.</p>`,
        code: `// min-heap parent/child indexes\nconst parent=i=>(i-1)>>1;\nconst left=i=>2*i+1, right=i=>2*i+2;`,
        mcq: [{ q: 'Min-heap root holds the?', o: ['Largest', 'Smallest', 'Median', 'Newest'], a: 1, e: 'The smallest value sits on top.' }, { q: 'Insert into a heap costs?', o: ['O(1)', 'O(log n)', 'O(n)', 'O(n²)'], a: 1, e: 'Sift-up goes at most the tree height.' }],
        pr: { d: 'Write <code>kthLargest(arr, k)</code> returning the k-th largest value (k=1 is the max).', fn: 'kthLargest', st: 'function kthLargest(arr,k){\n  // your code\n}', tests: [[[[3, 2, 1, 5, 6, 4], 2], 5], [[[1], 1], 1], [[[7, 7, 8], 3], 7]], sol: 'function kthLargest(a,k){ return [...a].sort((x,y)=>y-x)[k-1]; }' }
      },

      {
        id: 'greedy', lv: 'Greedy', t: 'Greedy Algorithms',
        learn: `<p>A <b>greedy</b> algorithm makes the best-looking choice at each step, hoping it leads to the best overall answer. It works only when local best choices combine into a global best.</p><div class="tip"><b>Analogy:</b> Giving change with the fewest coins: always hand over the largest coin that fits.</div><p>Typical pattern: sort first, then pick. Examples: activity selection, fractional knapsack, Huffman coding, jump game.</p>`,
        code: `// activity selection: sort by end time\nintervals.sort((a,b)=>a[1]-b[1]);\nlet end=-Infinity, n=0;\nfor(const [s,e] of intervals) if(s>=end){ n++; end=e; }`,
        mcq: [{ q: 'Greedy picks the?', o: ['Best choice now', 'Random choice', 'Last choice', 'All choices'], a: 0, e: 'It commits to the locally best option.' }, { q: 'Activity selection sorts by?', o: ['Start time', 'End time', 'Length', 'Name'], a: 1, e: 'Finishing early leaves the most room.' }],
        pr: { d: 'Write <code>maxActivities(intervals)</code>. Each interval is <code>[start,end]</code>. Return the maximum number of non-overlapping intervals (touching ends is allowed).', fn: 'maxActivities', st: 'function maxActivities(intervals){\n  // your code\n}', tests: [[[[[1, 3], [2, 4], [3, 5]]], 2], [[[[1, 2], [2, 3], [3, 4]]], 3], [[[[1, 10], [2, 3], [4, 5]]], 2]], sol: 'function maxActivities(a){ a=[...a].sort((x,y)=>x[1]-y[1]); let e=-Infinity,n=0; for(const [s,f] of a) if(s>=e){ n++; e=f; } return n; }' }
      },

      {
        id: 'nt', lv: 'Number Theory', t: 'Number Theory',
        learn: `<p>Number theory covers primes, GCD, modular arithmetic and combinatorics (nCr). The <b>Sieve of Eratosthenes</b> finds all primes up to n in O(n log log n).</p><div class="tip"><b>Analogy:</b> Cross out multiples of 2, then 3, then 5... whatever is left is prime.</div><p>Modular rule: <code>(a+b)%m = ((a%m)+(b%m))%m</code>. Euclid: <code>gcd(a,b)=gcd(b,a%b)</code>.</p>`,
        code: `const p=Array(n+1).fill(true); p[0]=p[1]=false;\nfor(let i=2;i*i<=n;i++)\n  if(p[i]) for(let j=i*i;j<=n;j+=i) p[j]=false;`,
        mcq: [{ q: 'Sieve of Eratosthenes finds?', o: ['Primes up to n', 'GCD', 'Factorials', 'Sorted data'], a: 0, e: 'It marks off multiples to leave primes.' }, { q: 'gcd(12, 18)?', o: ['3', '6', '12', '2'], a: 1, e: '6 is the largest number dividing both.' }],
        pr: { d: 'Write <code>countPrimes(n)</code> returning how many primes are &le; n (use a sieve).', fn: 'countPrimes', st: 'function countPrimes(n){\n  // your code\n}', tests: [[[10], 4], [[1], 0], [[30], 10], [[2], 1]], sol: 'function countPrimes(n){ const p=Array(n+1).fill(true); p[0]=p[1]=false; for(let i=2;i*i<=n;i++) if(p[i]) for(let j=i*i;j<=n;j+=i) p[j]=false; return p.filter(Boolean).length; }' }
      },

      {
        id: 'trie', lv: 'Trie', t: 'Trie',
        learn: `<p>A <b>trie</b> (prefix tree) stores words character by character. Each node has children for the next letters and a flag marking the end of a word.</p><div class="tip"><b>Analogy:</b> Phone autocomplete. Typing "ca" jumps straight to words starting with "ca".</div><p>Insert, search and prefix check cost O(L), where L is the word length. Used for autocomplete, spell check, and max-XOR problems.</p>`,

      {
        id: 'sm', lv: 'String Matching', t: 'String Matching',
        learn: `<p>Pattern matching finds where a pattern occurs in a text. Naive matching is O(n*m). Smarter algorithms speed this up:</p><ul><li><b>KMP:</b> precomputes a prefix table to never move back in the text. O(n+m).</li><li><b>Rabin-Karp:</b> compares rolling hash values.</li><li><b>Z algorithm:</b> uses matching-prefix lengths.</li></ul><div class="tip"><b>Analogy:</b> Ctrl+F in a document.</div>`,
        code: `for(let i=0;i+m<=n;i++){\n  let j=0;\n  while(j<m && t[i+j]===p[j]) j++;\n  if(j===m) return i;\n}\nreturn -1;`,
        mcq: [{ q: 'KMP time complexity?', o: ['O(n+m)', 'O(n*m)', 'O(n²)', 'O(log n)'], a: 0, e: 'The text pointer never moves backward.' }, { q: 'Rabin-Karp compares using?', o: ['Hashes', 'Trees', 'Heaps', 'Stacks'], a: 0, e: 'A rolling hash is updated per shift.' }],
        pr: { d: 'Write <code>findPattern(text, pat)</code> returning the first index where pat occurs, or -1. Do not use indexOf or includes.', fn: 'findPattern', st: 'function findPattern(text,pat){\n  // your code\n}', tests: [[['hello', 'll'], 2], [['abc', 'd'], -1], [['aaa', 'aa'], 0]], sol: 'function findPattern(t,p){ for(let i=0;i+p.length<=t.length;i++){ let j=0; while(j<p.length&&t[i+j]===p[j]) j++; if(j===p.length) return i; } return -1; }' }
      },

      {
        id: 'rq', lv: 'Range Query', t: 'Segment Tree & Fenwick Tree',
        learn: `<p>When you need many <b>range queries</b> (sum, min, max) mixed with <b>updates</b>, prefix sums are too slow to rebuild. Two tools solve this in O(log n):</p><ul><li><b>Segment tree:</b> each node stores the answer for a range. Supports sum, min, max, with lazy propagation for range updates.</li><li><b>Fenwick tree (BIT):</b> compact array for prefix sums with point updates.</li></ul><div class="tip"><b>Analogy:</b> A tournament bracket. Each match stores the winner of a group, so you never replay everything.</div>`,
        code: `// Fenwick tree update and prefix query\nfunction upd(i,d){ for(i++;i<=n;i+=i&-i) bit[i]+=d; }\nfunction qry(i){ let s=0; for(i++;i>0;i-=i&-i) s+=bit[i]; return s; }`,

    T.find(t => t.id === 'sq').t = 'Stack';
    const ORDER = 'bigo maths rec arr str bs sort bit hash two win pre back ll sq queue deque tree bst heap graph greedy dp nt trie sm rq'.split(' ');
    T.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

    // ===== STATE (saved in browser localStorage) =====
    let S = { quiz: {}, code: {} }, cur = 0, tab = 'learn';
    try { S = JSON.parse(localStorage.getItem('dsa') || '') || S } catch (e) { }
    const save = () => { try { localStorage.setItem('dsa', JSON.stringify(S)) } catch (e) { } };
    const $ = id => document.getElementById(id);
    // ===== LANGUAGE (English / Gujarati) =====
    const UI = {
      en: { title: 'DSA Course', score: 'Score', learn: 'Learn', practice: 'Practice code', quiz: 'Quiz', next: 'Next: practice', code: 'Code example', run: 'Run tests', sol: 'Show answer', reset: 'Reset code', submit: 'Submit answers', retake: 'Retake quiz', qs: 'Quiz score', fin: 'View final result', rst: 'Reset progress', soon: 'The Gujarati lesson for this topic is coming soon. Showing English for now.' },
      gu: { title: 'DSA કોર્સ', score: 'સ્કોર', learn: 'શીખો', practice: 'Code પ્રેક્ટિસ', quiz: 'ક્વિઝ', next: 'આગળ: પ્રેક્ટિસ', code: 'Code ઉદાહરણ', run: 'Tests ચલાવો', sol: 'જવાબ બતાવો', reset: 'Code રીસેટ', submit: 'જવાબ Submit કરો', retake: 'ફરી ક્વિઝ આપો', qs: 'ક્વિઝ સ્કોર', fin: 'અંતિમ પરિણામ જુઓ', rst: 'Progress રીસેટ', soon: 'આ topic નો ગુજરાતી lesson ટૂંક સમયમાં આવશે. હાલ English બતાવ્યું છે.' }
    };
    const SG = { 'Fundamentals': 'પાયાની બાબતો', 'Maths, Pattern & Recursion': 'Maths, Pattern અને Recursion', 'Array & String': 'Array અને String' };
    let LANG = 'en'; try { LANG = localStorage.getItem('lp_lang') || 'en' } catch (e) { }
    const L = k => (UI[LANG][k] || UI.en[k]);
    const sec = x => (LANG === 'gu' && SG[x]) || x;
    function setLang(l) { LANG = l; try { localStorage.setItem('lp_lang', l) } catch (e) { } if (tab === 'result') showResult(); else render() }
    function applyStatic() {
      document.documentElement.lang = LANG; $('ttl').textContent = L('title'); $('b-res').textContent = L('fin'); $('b-rst').textContent = L('rst');
      ['en', 'gu'].forEach(x => $('l-' + x).className = LANG === x ? 'on' : '')
    }
    const qScore = i => { const r = S.quiz[T[i].id]; return r ? r.a.filter((x, k) => x === T[i].mcq[k].a).length : 0 };
    const cScore = i => (S.code[T[i].id] || {}).pass ? 2 : 0;
    const topicScore = i => qScore(i) + cScore(i);
    const maxT = i => T[i].mcq.length + (T[i].pr ? 2 : 0);
    const done = i => !!S.quiz[T[i].id] && (!T[i].pr || !!(S.code[T[i].id] || {}).pass);

    function renderNav() {
      applyStatic();
      let h = '', last = '';
      T.forEach((t, i) => {
        if (t.lv !== last) { h += `<div class="lv">${sec(t.lv)}</div>`; last = t.lv }
        h += `<button class="${i === cur && tab !== 'result' ? 'on' : ''}" onclick="go(${i})"><span>${t.t}</span><span>${done(i) ? '✓' : topicScore(i) + '/' + maxT(i)}</span></button>`
      });
      $('nav').innerHTML = h;
      const tot = T.reduce((s, _, i) => s + topicScore(i), 0), mx = T.reduce((s, _, i) => s + maxT(i), 0);
      $('side-score').textContent = `${L('score')} ${tot} / ${mx}`;
      $('pbar').style.width = (tot / mx * 100) + '%';
    }
    function go(i, tb) { cur = i; tab = tb || 'learn'; render(); window.scrollTo(0, 0) }
    function render() {
      renderNav();
      if (tab === 'result') return;
      const t = T[cur];
      $('main').innerHTML = `<span class="tag">${sec(t.lv)}</span><h2 style="margin:8px 0 0">${t.t}</h2>
  <div class="tabs">${['learn', 'practice', 'quiz'].map(x => `<button class="${tab === x ? 'on' : ''}" onclick="go(${cur},'${x}')">${L(x)}</button>`).join('')}</div><div id="body"></div>`;
      ({ learn: renderLearn, practice: renderPractice, quiz: renderQuiz })[tab]();
    }
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    // ----- Detailed bilingual lesson for Big-O (add more topics the same way: topic.ld={en,gu}) -----
    const TB = (h, r) => `<table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${r.map(q => `<tr>${q.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
    const CB = (t, sp) => `<p><span class="tag">Time: ${t}</span> <span class="tag">Space: ${sp}</span></p>`;
    const PR = (e, g) => [`<p>${e}</p>`, `<p>${g}</p>`];
    const H3 = (e, g) => [`<h3>${e}</h3>`, `<h3>${g || e}</h3>`];
    const TIP = (e, g) => [`<div class="tip">${e}</div>`, `<div class="tip">${g}</div>`];
    const CD = c => `<pre>${esc(c)}</pre>`;
    const PERF = [['O(1)', 'Constant', ['Excellent', 'ખૂબ સારી']], ['O(log n)', 'Logarithmic', ['Excellent', 'ખૂબ સારી']], ['O(n)', 'Linear', ['Good', 'સારી']], ['O(n log n)', 'Linearithmic', ['Good', 'સારી']], ['O(n²)', 'Quadratic', ['Slow', 'ધીમી']], ['O(2ⁿ)', 'Exponential', ['Very slow', 'ખૂબ ધીમી']], ['O(n!)', 'Factorial', ['Extremely slow', 'અત્યંત ધીમી']]];
    const BB = [
      PR('<b>Big-O</b> tells us how efficient our code is: as the input grows, how much time or memory does it need? It has two parts: <b>Time Complexity</b> (how long the code takes to run) and <b>Space Complexity</b> (how much extra memory it uses).', '<b>Big-O</b> આપણને જણાવે છે કે આપણો code કેટલો efficient છે અને input data વધે ત્યારે code ને execute કરવામાં કેટલો સમય અથવા memory લાગી શકે છે. તેના બે ભાગ છે: <b>Time Complexity</b> (Code execute થવામાં કેટલો સમય લાગે છે) અને <b>Space Complexity</b> (Code execute થતી વખતે કેટલી additional memory વપરાય છે).'),
      TIP('<b>Analogy:</b> Finding a name in a phone book. Reading every page is O(n). Opening the middle and halving each time is O(log n). Knowing the page number is O(1).', '<b>Analogy:</b> Phone book માં નામ શોધવું. દરેક page વાંચવું તે O(n). વચ્ચેથી ખોલીને દરેક વખતે અડધું કરવું તે O(log n). પહેલેથી page number ખબર હોય તો O(1).'),
      H3('1. O(1) – Constant Time'),
      PR('Best complexity. No matter how big the input is, the code does one fixed operation.', 'Best Complexity. Input કેટલું પણ મોટું હોય, code ને એક જ fixed operation કરવાનું રહે છે.'),
      CD(`function getFirstElement(arr) {
  return arr[0];
}
getFirstElement([10, 20, 30, 40, 50]);`),
      PR('<b>What happens here:</b> we only read <code>arr[0]</code>. Whether the array has 5 or 10,000 items, it is one step.', '<b>અહીં શું થાય છે:</b> આપણે ફક્ત <code>arr[0]</code> access કરીએ છીએ. Array માં 5 elements હોય કે 10,000, કામ એક જ step નું છે.'),
      TB(['Items', 'Operations'], [['5', '1'], ['100', '1'], ['10000', '1']]), CB('O(1)', 'O(1)'),
      H3('2. O(n) – Linear Time'),
      PR('Operations grow in the same proportion as the input.', 'Input જેટલું વધે છે, operations પણ એટલાં જ પ્રમાણમાં વધે છે.'),
      CD(`function printElements(arr) {
  for (let i = 0; i < arr.length; i++) {
    console.log(arr[i]);
  }
}`),
      TB(['Elements', 'Operations'], [['5', '5'], ['10', '10'], ['100', '100'], ['1000', '1000']]),
      PR('Here <code>n</code> is the length of the input.', 'અહીં <code>n</code> એટલે input ની length.'), CB('O(n)', 'O(1)'),
      H3('3. O(n²) – Quadratic Time', '3. O(n²) – Quadratic Time'),
      PR('A loop inside another loop often gives O(n²). It is slow for large inputs.', 'એક loop ની અંદર બીજો loop હોય ત્યારે ઘણીવાર O(n²) complexity બને છે. મોટા input માટે ધીમી.'),
      CD(`function printPairs(arr) {
  for (let i = 0; i < arr.length; i++) {
    for (let j = 0; j < arr.length; j++) {
      console.log(arr[i], arr[j]);
    }
  }
}`),
      TB(['Elements', 'Operations'], [['3', '3 × 3 = 9'], ['5', '5 × 5 = 25'], ['10', '10 × 10 = 100'], ['100', '100 × 100 = 10,000']]), CB('O(n²)', 'O(1)'),
      H3('4. O(log n) – Logarithmic Time'),
      PR('When every step cuts the data in half we get O(log n). The classic example is <b>Binary Search</b>. The array must be sorted.', 'જ્યારે દરેક step માં input data અડધો થતો જાય ત્યારે O(log n) complexity બને છે. સૌથી સારું example <b>Binary Search</b> છે. Array sorted હોવો જરૂરી છે.'),
      CD(`function binarySearch(arr, target) {
  let left = 0, right = arr.length - 1;
  while (left <= right) {
    let mid = Math.floor((left + right) / 2);
    if (arr[mid] === target) return mid;
    if (arr[mid] < target) left = mid + 1;
    else right = mid - 1;
  }
  return -1;
}`),
      PR('<b>Dry run:</b> <code>binarySearch([10,20,30,40,50,60,70,80], 70)</code>', '<b>Dry run:</b> <code>binarySearch([10,20,30,40,50,60,70,80], 70)</code>'),
      TB(['left', 'right', 'mid', 'arr[mid]', 'action'], [['0', '7', '3', '40', '40 < 70, left = 4'], ['4', '7', '5', '60', '60 < 70, left = 6'], ['6', '7', '6', '70', 'found → return 6']]),
      PR('Half of the array is discarded in every iteration.', 'દરેક iteration માં array નો અડધો ભાગ remove થાય છે.'), CB('O(log n)', 'O(1)'),
      H3('5. O(n log n) – Linearithmic Time'),
      PR('Seen in efficient sorting: Merge Sort, Heap Sort and average-case Quick Sort. The array is split in half again and again, then merged back.', 'આ complexity efficient sorting algorithms માં જોવા મળે છે: Merge Sort, Heap Sort, Average-case Quick Sort. Array ને વારંવાર બે ભાગમાં divide કરીને પછી merge કરવામાં આવે છે.'),
      H3('6. O(2ⁿ) – Exponential Time'),
      CD(`function fibonacci(n) {
  if (n <= 1) return n;
  return fibonacci(n - 1) + fibonacci(n - 2);
}`),
      PR('One function makes two recursive calls, so the number of calls explodes as n grows. O(2ⁿ) is an upper bound; more precisely it is Θ(φⁿ).', 'એક function બે recursive calls કરે છે, એટલે n વધતા calls ઝડપથી વધે છે. O(2ⁿ) અહીં upper bound છે; વધુ ચોક્કસ રીતે Θ(φⁿ).'),
      H3('Big-O comparison', 'Big-O Complexity Comparison'),
      [0, 1].map(i => TB(['Complexity', 'Name', 'Performance'], PERF.map(r => [r[0], r[1], r[2][i]]))),
      PR('Approximate operations as the input grows:', 'Input વધે ત્યારે operations ની અંદાજિત સંખ્યા:'),
      TB(['n', 'O(1)', 'O(log n)', 'O(n)', 'O(n log n)', 'O(n²)'], [['10', '1', '3', '10', '33', '100'], ['100', '1', '7', '100', '664', '10,000'], ['1000', '1', '10', '1000', '9,966', '1,000,000']]),
      H3('How to calculate Big-O', 'Big-O કેવી રીતે calculate કરવું?'),
      PR('<b>Rule 1 – Single loop:</b> <code>for (i&lt;n)</code> → <b>O(n)</b>', '<b>Rule 1 – Single Loop:</b> <code>for (i&lt;n)</code> → <b>O(n)</b>'),
      PR('<b>Rule 2 – Nested loop:</b> a loop inside a loop → <b>O(n²)</b>', '<b>Rule 2 – Nested Loop:</b> loop ની અંદર loop → <b>O(n²)</b>'),
      PR('<b>Rule 3 – Sequential loops:</b> O(n + n) = O(2n) = <b>O(n)</b>, because Big-O ignores constants.', '<b>Rule 3 – Sequential Loops:</b> O(n + n) = O(2n) = <b>O(n)</b>, કારણ કે Big-O માં constants ignore કરીએ છીએ.'),
      PR('<b>Rule 4 – Different inputs:</b> one loop over arr1 and one over arr2 → <b>O(a + b)</b>, since the lengths can differ.', '<b>Rule 4 – Different Inputs:</b> arr1 અને arr2 પર અલગ loops → <b>O(a + b)</b>, કારણ કે બંને arrays ની length અલગ હોઈ શકે છે.'),
      PR('<b>Rule 5 – Value doubles:</b> <code>for (i = 1; i &lt; n; i *= 2)</code> → <b>O(log n)</b>', '<b>Rule 5 – Loop માં value double થાય:</b> <code>for (i = 1; i &lt; n; i *= 2)</code> → <b>O(log n)</b>'),
      TIP('<b>Interview tip:</b> say the complexity out loud and explain why. Know the cost of array methods (map, filter, find), nested loops, Set, Map, sorting and searching.', '<b>Interview tip:</b> Complexity બોલીને કારણ પણ સમજાવો. Array methods (map, filter, find), nested loops, Set, Map, sorting અને searching ની complexity જાણવી ખૂબ ઉપયોગી છે.')
    ];
    T.find(t => t.id === 'bigo').ld = { en: BB.map(b => Array.isArray(b) ? b[0] : b).join(''), gu: BB.map(b => Array.isArray(b) ? b[1] : b).join('') };
    function renderLearn() {
      const t = T[cur], d = t.ld && t.ld[LANG];
      $('body').innerHTML = `<div class="card">${d || t.learn + '<h3>' + L('code') + '</h3><pre>' + esc(t.code) + '</pre>'}${!d && LANG === 'gu' ? '<div class="tip">' + L('soon') + '</div>' : ''}</div>
  <button class="btn p" onclick="go(cur,'practice')">${L('next')}</button>`;
    }
    // ----- Practice -----
    function renderPractice() {
      if (!T[cur].pr) { $('body').innerHTML = '<div class="card">Coding practice for this topic is coming soon. Take the quiz to earn points.</div>'; return }
      const t = T[cur], p = t.pr, saved = (S.code[t.id] || {}).src || p.st;
      $('body').innerHTML = `<div class="card"><p>${p.d}</p>
  <textarea id="ed" spellcheck="false" aria-label="Code editor">${esc(saved)}</textarea>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="runTests()">${L('run')}</button>
  <button class="btn" onclick="showSol()">${L('sol')}</button><button class="btn" onclick="$('ed').value=T[cur].pr.st">${L('reset')}</button></div>
  <div class="res" id="res"></div><div id="sol"></div></div>`;
      $('ed').addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); const s = e.target.selectionStart; e.target.setRangeText('  ', s, s, 'end') } });
    }
    function runTests() {
      const t = T[cur], p = t.pr, src = $('ed').value; let ok = 0, out = '';
      try {
        const f = new Function(src + '\nreturn ' + p.fn + ';')();
        p.tests.forEach((c, k) => {
          let got, pass = false;
          try { got = f(...JSON.parse(JSON.stringify(c[0]))); pass = JSON.stringify(got) === JSON.stringify(c[1]) } catch (e) { got = 'Error: ' + e.message }
          if (pass) ok++;
          out += `<div class="${pass ? 'p' : 'f'}">${pass ? 'PASS' : 'FAIL'} test ${k + 1}: ${p.fn}(${esc(JSON.stringify(c[0]).slice(1, -1))}) → ${esc(String(JSON.stringify(got)))}${pass ? '' : ' (expected ' + esc(JSON.stringify(c[1])) + ')'}</div>`;
        });
      } catch (e) { out = `<div class="f">Error: ${esc(e.message)}</div>` }
      const all = ok === p.tests.length;
      out = `<b>${ok}/${p.tests.length} tests passed${all ? '. Well done! +2 points' : ''}</b>` + out;
      $('res').innerHTML = out;
      S.code[t.id] = { src, pass: all || (S.code[t.id] || {}).pass }; save(); renderNav();
    }
    function showSol() { $('sol').innerHTML = `<p><b>Reference answer</b></p><pre>${esc(T[cur].pr.sol)}</pre>` }
    // ----- Quiz -----
    function renderQuiz() {
      const t = T[cur], r = S.quiz[t.id], sel = r ? r.a : [];
      let h = '<div class="card">';
      t.mcq.forEach((m, k) => {
        h += `<p><b>${k + 1}. ${m.q}</b></p>`;
        m.o.forEach((o, j) => {
          let c = 'opt';
          if (r) { if (j === m.a) c += ' ok'; else if (sel[k] === j) c += ' no' } else if (sel[k] === j) c += ' sel';
          h += `<button class="${c}" ${r ? 'disabled' : ''} onclick="pick(${k},${j})">${o}</button>`
        });
        if (r) h += `<div class="exp">${sel[k] === m.a ? 'Correct. ' : 'Not quite. '}${m.e}</div>`;
      });
      h += r ? `<p><b>${L('qs')}: ${qScore(cur)}/${t.mcq.length}</b></p><button class="btn" onclick="retake()">${L('retake')}</button>`
        : `<button class="btn p" onclick="submitQuiz()">${L('submit')}</button>`;
      $('body').innerHTML = h + '</div>';
    }
    let draft = [];
    function pick(k, j) {
      if (S.quiz[T[cur].id]) return; S.quiz['_d' + T[cur].id] = S.quiz['_d' + T[cur].id] || []; S.quiz['_d' + T[cur].id][k] = j; draft = S.quiz['_d' + T[cur].id];
      document.querySelectorAll('.opt').forEach((b, idx) => { const q = Math.floor(idx / 4); b.classList.toggle('sel', draft[q] === idx % 4) })
    }
    function submitQuiz() {
      const t = T[cur], d = S.quiz['_d' + t.id] || [];
      if (t.mcq.some((_, k) => d[k] === undefined)) { alert('Answer every question first.'); return }
      S.quiz[t.id] = { a: d.slice() }; delete S.quiz['_d' + t.id]; save(); render();
    }
    function retake() { delete S.quiz[T[cur].id]; save(); render() }
    // ----- Final result -----
    function showResult() {
      tab = 'result'; renderNav();
      const tot = T.reduce((s, _, i) => s + topicScore(i), 0), mx = T.reduce((s, _, i) => s + maxT(i), 0), pc = Math.round(tot / mx * 100);
      const grade = pc >= 85 ? 'Expert level' : pc >= 60 ? 'Solid progress' : pc >= 30 ? 'Keep practising' : 'Just getting started';
      let h = `<div class="card"><h2 style="margin:0">Final result</h2><div class="big">${pc}%</div><p>${tot} of ${mx} points. <b>${grade}</b></p></div>`;
      T.forEach((t, i) => {
        const r = S.quiz[t.id];
        h += `<div class="card"><h3 style="margin:0 0 6px">${t.t} <span class="tag">${topicScore(i)}/${maxT(i)}</span></h3>`;
        if (!r) h += '<p class="exp">Quiz not attempted yet.</p>';
        else t.mcq.forEach((m, k) => {
          const good = r.a[k] === m.a;
          h += `<p style="margin:6px 0"><b>${m.q}</b><br><span style="color:var(--${good ? 'ok' : 'bad'})">Your answer: ${m.o[r.a[k]]}</span>${good ? '' : `<br><span style="color:var(--ok)">Correct answer: ${m.o[m.a]}</span>`}<br><span class="exp">${m.e}</span></p>`
        });
        h += !t.pr ? '' : `<p style="margin:6px 0">Coding: ${cScore(i) ? '<span style="color:var(--ok)">Passed all tests</span>' : 'Not passed yet'}</p>`;
        h += `<button class="btn" onclick="go(${i},'practice')">Open topic</button></div>`;
      });
      $('main').innerHTML = h;
    }
    function resetAll() { if (confirm('Clear all scores and saved code?')) { S = { quiz: {}, code: {} }; save(); go(0) } }
    render();
  </script>
</body>
